# Shared lint rules. Packages include this file.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - unawaited_futures
    - directives_ordering
