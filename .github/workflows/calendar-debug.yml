name: calendar-debug
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/game_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Test
        shell: bash
        run: |
          set +e
          dart test test/season_calendar_test.dart test/cup_final_test.dart -r expanded > t.txt 2>&1
          code=$?
          msg=$(grep -vE '^#[0-9]|package:test|dart:' t.txt | grep -vE '^[0-9:]+ \+[0-9]+: .*(passed|[a-z]$)' | head -50 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800)
          echo "::error::${msg}"
          exit $code
