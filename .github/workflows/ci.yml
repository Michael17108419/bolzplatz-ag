name: ci

on:
  push:
  pull_request:

jobs:
  game_core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/game_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format .
      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^\s*(info|warning|error) ' analyze.txt | head -20 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - run: dart test

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: bolzplatz-windows
          path: app/build/windows/x64/runner/Release
