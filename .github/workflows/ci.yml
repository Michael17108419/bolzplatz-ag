name: ci

on:
  push:
    paths-ignore:
      - '**.md'
      - 'app/tool/out/**'
      - 'data/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

# A new push cancels the older run of the same branch: no minutes wasted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game_core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/game_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format .
      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^\s*(info|warning|error) ' analyze.txt | head -20 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - name: Test
        shell: bash
        run: |
          set +e
          dart test -r expanded > test.txt 2>&1
          code=$?
          cat test.txt
          grep -E 'MATCH-REPORT|SEASON-REPORT|BALANCE-REPORT' test.txt | while read -r line; do echo "::notice::${line}"; done
          if [ $code -ne 0 ]; then
            msg=$(grep -vE 'package:(flutter|test|drift|async|stack_trace)|^#[0-9]|^dep ' test.txt | tail -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800)
            echo "::error::${msg}"
          fi
          exit $code

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code
        shell: bash
        run: |
          set +e
          flutter pub deps --style=list | grep -E '^- (build|build_runner|build_runner_core|build_daemon|analyzer|drift_dev|source_gen) ' | while read -r line; do echo "::error::dep ${line}"; done
          dart run build_runner build --delete-conflicting-outputs > build.txt 2>&1
          code=$?
          cat build.txt
          grep -iE 'error|severe|exception|\[SEVERE\]' build.txt | head -20 | while read -r line; do echo "::error::${line}"; done
          grep -A8 'missing implementations' build.txt | head -12 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - run: dart format lib test
      - name: Analyze app
        shell: bash
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^\s*(info|warning|error) ' analyze.txt | head -20 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - name: Test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          grep 'M0-REPORT' test.txt | while read -r line; do echo "::notice::${line}"; done
          if [ $code -ne 0 ]; then
            msg=$(grep -vE 'package:(flutter|test|drift|async|stack_trace)|^#[0-9]|^dep ' test.txt | tail -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800)
            echo "::error::${msg}"
          fi
          exit $code

  # The Windows build costs about twice as much, so it only runs by hand
  # (Actions > ci > Run workflow), not on every push.
  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: [game_core, app]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code
        shell: bash
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: bolzplatz-windows
          path: app/build/windows/x64/runner/Release
      # Also kept as a zip on the branch "windows-build", so it can be
      # fetched with git (no artifact download needed).
      - name: Publish zip to branch
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip "$RUNNER_TEMP/Bolzplatz_AG_Windows.zip" . > /dev/null
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan windows-build
          git rm -rf . > /dev/null
          cp "$RUNNER_TEMP/Bolzplatz_AG_Windows.zip" .
          git add Bolzplatz_AG_Windows.zip
          git commit -m "Windows build $GITHUB_SHA" > /dev/null
          git push -f origin windows-build

  # The web app (phone-friendly test version). Built after the tests and
  # kept on the branch "web-build"; where it is hosted is decided apart.
  web:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [game_core, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code
        shell: bash
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Web scaffold
        shell: bash
        run: |
          flutter create --platforms=web --project-name bolzplatz_app --org de.bolzplatz .
          sed -i 's/<title>[^<]*<\/title>/<title>Bolzplatz AG<\/title>/' web/index.html
          sed -i 's/"name": "[^"]*"/"name": "Bolzplatz AG"/; s/"short_name": "[^"]*"/"short_name": "Bolzplatz"/' web/manifest.json
      - name: Build web
        shell: bash
        run: |
          set +e
          flutter build web --release > web.txt 2>&1
          code=$?
          cat web.txt
          grep -iE 'error|unsupported' web.txt | head -15 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: bolzplatz-web
          path: app/build/web
      - name: Publish to branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd build/web
          touch .nojekyll
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b web-build
          git add -A
          git commit -qm "Web build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-build
