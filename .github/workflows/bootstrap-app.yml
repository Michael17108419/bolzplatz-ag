name: bootstrap-app

# One-off: creates the Flutter Windows project in app/ and commits it.
# Needed because the Flutter SDK is not available where the code is written.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter --version
      - name: Create project
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --project-name bolzplatz_app --org de.bolzplatz --empty .
          flutter pub add flutter_riverpod drift drift_flutter
          flutter pub add --dev drift_dev build_runner
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app
          git commit -m "Create Flutter Windows project (bootstrap)"
          git push
