name: generate-world

# Run by hand. Creates data/world_2026_27.json from the rules, the club list
# and the name lists, and commits it. The file is shipped with the game, so
# only run this when the world is meant to change.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (empty = seed from the rules file)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Generate world
        working-directory: tools
        run: |
          dart pub get
          dart run bin/generate_world.dart ${{ github.event.inputs.seed }}
      - name: Commit world file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world_2026_27.json
          git diff --cached --quiet || git commit -m "Generate start world 2026/27"
          git push
