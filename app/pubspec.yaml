name: bolzplatz_app
description: "Bolzplatz AG, Windows app (platform check in Phase 0)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  archive: ^4.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.10
  game_core:
    path: ../packages/game_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
          weight: 400
        - asset: assets/fonts/Figtree.ttf
          weight: 700
